# Конфигурация ПР1 — параметры анализа качества данных
# Общие 7 пунктов §1.1 наследуются из PRELIMINARY_SUBMISSION_V2/config.yaml
pr1:
  reference: PRELIMINARY_SUBMISSION_V2/config.yaml (общие 7 пунктов §1.1 унаследованы)
  random_seed: 42
  bootstrap:
    B: 2000
    method: percentile (BCa не применялся)
  mmd:
    kernel: rbf
    bandwidth: median heuristic (gamma = 1.386e-03)
    n_permutations: 200
    p_value: 0.705
    statistic: -0.000392
    null_percentiles_95:
    - -0.000786
    - 0.001847
    per_class:
      COVID:
        mmd: 0.000309
        p: 0.26
      Normal:
        mmd: 0.000225
        p: 0.21
    note: n_permutations = 200 (фактическое значение в ПР1); разрешение p-value 0.005
  c2st:
    classifier: LogisticRegression (StandardScaler, max_iter=2000)
    cv_folds: 5
    accuracy: 0.5923
    accuracy_ci_95_wilson:
    - 0.5718
    - 0.6126
    balanced_accuracy: 0.5037
    auc: 0.4885
    auc_ci_95_bootstrap:
    - 0.464
    - 0.5139
    note: AUC — нелинейная метрика, поэтому интервал bootstrap (§1.3), а не Wilson
  cleanlab:
    method: confident_learning (find_label_issues)
    cv: 5
    oos_probs: логистическая голова на эмбеддингах замороженной ResNet18, предсказание
      на исключённом фолде
    label_error_rate_train: 0.0
    label_error_rate_test: 0.004167
    test_ci_95_wilson:
    - 0.001418
    - 0.012178
    test_counts: 3/720
    manual_inspection: label_inspection.csv (топ-10 train + 3 test)
  duplicates:
    exact_hash_method: md5 (файловые байты)
    near_hash_method: imagehash.phash (DCT 8x8, hamming <= 6) + пиксельная верификация
      (mean|diff| <= 10)
    exact_rate: 0.006389
    exact_ci_95_wilson:
    - 0.004794
    - 0.008511
    near_rate: 0.036389
    near_ci_95_wilson:
    - 0.032305
    - 0.040967
    structural_similar_pairs: 1929
    cross_class_confirmed_pairs: 0
  leakage_train_test:
    exact_pairs: 7
    near_pairs: 64
    exact_share_of_train_ci_95_wilson:
    - 0.000589
    - 0.002507
    near_share_of_train_ci_95_wilson:
    - 0.008711
    - 0.014163
    note: точные счётчики — точная характеристика фиксированного набора (§2.4)
  image_quality:
    brisque:
      covid:
        mean: 29.0599
        ci_95_bootstrap:
        - 27.685
        - 30.5289
      normal:
        mean: 29.7285
        ci_95_bootstrap:
        - 28.8134
        - 30.6096
    niqe:
      covid:
        mean: 6.5223
        ci_95_bootstrap:
        - 6.3089
        - 6.7554
      normal:
        mean: 5.9105
        ci_95_bootstrap:
        - 5.8023
        - 6.0224
    subsample_n: 450
  anomalies:
    niqe_anomaly_rate:
      value: 0.022222
      ci_95_wilson:
      - 0.006115
      - 0.077445
    blur_anomaly_rate:
      value: 0.025
      ci_95_wilson:
      - 0.021639
      - 0.028867
    brisque_outlier_rate:
      value: 0.022222
      ci_95_wilson:
      - 0.006115
      - 0.077445
      note: рассчитано по сохранённой подвыборке; порог — Q97.5 train
    black_border_rate_normal:
      value: 0.006944
      ci_95_wilson:
      - 0.004708
      - 0.010232
  remediation:
    G1_training_duration: carried_over + supplemented by inference_latency.json
    G2_patient_ids: addressed via perceptual-hash leakage analysis (7 exact + 64 near
      pairs)
    G3_license: addressed in PRELIMINARY_SUBMISSION_V2/dataset_source.md (reused)
